# CI (PHASE-1.md §10): every push and pull request runs the type check and unit tests, then builds the image and runs
# the pgTAP and end-to-end tests on it. A push to main that passes publishes the image to GitHub Container Registry.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run typecheck
        working-directory: client
      - run: npm test
        working-directory: client

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/hy916-cn/dolphin-cloud
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: DOLPHIN_VERSION=${{ github.sha }}
          tags: dolphin-cloud:dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Database tests (pgTAP)
        run: docker/db-test.sh dolphin-cloud:dev
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: client
      - name: End-to-end tests (Playwright)
        run: docker/e2e-test.sh dolphin-cloud:dev
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: client/test-results
          retention-days: 7
      - name: Publish the image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag dolphin-cloud:dev "$IMAGE:main"
          docker tag dolphin-cloud:dev "$IMAGE:sha-${GITHUB_SHA::7}"
          docker push "$IMAGE:main"
          docker push "$IMAGE:sha-${GITHUB_SHA::7}"
