[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:postgres]
command=docker-entrypoint.sh postgres -c listen_addresses=127.0.0.1 -c timezone=UTC
priority=10
stopsignal=INT
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:auth]
command=wait-for-db auth
priority=20
environment=
    GOTRUE_API_HOST="127.0.0.1",
    PORT="9999",
    API_EXTERNAL_URL="%(ENV_SITE_URL)s/auth/v1",
    GOTRUE_SITE_URL="%(ENV_SITE_URL)s",
    GOTRUE_DB_DRIVER="postgres",
    GOTRUE_DB_DATABASE_URL="postgres://supabase_auth_admin:%(ENV_POSTGRES_PASSWORD)s@127.0.0.1:5432/postgres",
    GOTRUE_DB_MIGRATIONS_PATH="/usr/local/etc/auth/migrations",
    GOTRUE_JWT_SECRET="%(ENV_JWT_SECRET)s",
    GOTRUE_JWT_EXP="3600",
    GOTRUE_JWT_AUD="authenticated",
    GOTRUE_JWT_DEFAULT_GROUP_NAME="authenticated",
    GOTRUE_JWT_ADMIN_ROLES="service_role",
    GOTRUE_JWT_ISSUER="%(ENV_SITE_URL)s/auth/v1",
    GOTRUE_DISABLE_SIGNUP="true",
    GOTRUE_PASSWORD_MIN_LENGTH="8",
    GOTRUE_PASSWORD_REQUIRED_CHARACTERS="abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ:0123456789",
    GOTRUE_EXTERNAL_EMAIL_ENABLED="true",
    GOTRUE_MAILER_AUTOCONFIRM="true",
    GOTRUE_EXTERNAL_PHONE_ENABLED="false",
    GOTRUE_SESSIONS_INACTIVITY_TIMEOUT="168h",
    GOTRUE_RATE_LIMIT_HEADER="X-Forwarded-For",
    GOTRUE_RATE_LIMIT_TOKEN_REFRESH="3000",
    GOTRUE_RATE_LIMIT_VERIFY="3000"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:migrate]
command=dolphin-migrate
priority=30
autorestart=unexpected
startsecs=0
exitcodes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:rest]
command=wait-for-db postgrest
priority=40
environment=
    PGRST_DB_URI="postgres://authenticator:%(ENV_POSTGRES_PASSWORD)s@127.0.0.1:5432/postgres",
    PGRST_DB_SCHEMAS="public",
    PGRST_DB_EXTRA_SEARCH_PATH="public",
    PGRST_DB_ANON_ROLE="anon",
    PGRST_JWT_SECRET="%(ENV_JWT_SECRET)s",
    PGRST_SERVER_HOST="127.0.0.1",
    PGRST_SERVER_PORT="3000",
    PGRST_DB_MAX_ROWS="1000"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:storage]
command=wait-for-db node dist/start/server.js
directory=/opt/storage
priority=40
environment=
    NODE_ENV="production",
    SERVER_HOST="127.0.0.1",
    SERVER_PORT="5000",
    ANON_KEY="%(ENV_ANON_KEY)s",
    SERVICE_KEY="%(ENV_SERVICE_ROLE_KEY)s",
    AUTH_JWT_SECRET="%(ENV_JWT_SECRET)s",
    POSTGREST_URL="http://127.0.0.1:3000",
    DATABASE_URL="postgres://supabase_storage_admin:%(ENV_POSTGRES_PASSWORD)s@127.0.0.1:5432/postgres",
    DB_INSTALL_ROLES="false",
    STORAGE_PUBLIC_URL="%(ENV_SITE_URL)s/storage/v1",
    REQUEST_ALLOW_X_FORWARDED_PATH="true",
    STORAGE_BACKEND="file",
    FILE_STORAGE_BACKEND_PATH="/data/storage",
    GLOBAL_S3_BUCKET="files",
    TENANT_ID="dolphin",
    REGION="local",
    FILE_SIZE_LIMIT="5242880",
    ENABLE_IMAGE_TRANSFORMATION="false"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:caddy]
command=caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
priority=50
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:cert-watch]
command=dolphin-cert-watch
priority=55
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:backup-schedule]
command=dolphin-backup-schedule
priority=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
