<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>DatePicker</title><style>body{padding:24px}.dc-toast,.dc-sheet,.dc-scrim,.dc-progress-fill,.dc-notice,.dc-guide-bubble,.dc-field-hint{animation:none}</style></head>
<body>
<div style="max-width:380px"><div class="dc-field dc-date" data-today="2026-10-30"><label class="dc-field-label" for="qd"><svg class="dc-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v3"/><path d="M16 2v3"/><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="m9 15 2 2 4-4"/></svg>查询日期</label><button class="dc-date-trigger" id="qd" type="button" aria-haspopup="dialog" aria-expanded="true" aria-controls="qd-cal"><span>2026年10月27日 星期二</span><svg class="dc-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v3"/><path d="M16 2v3"/><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="m9 15 2 2 4-4"/></svg></button><div class="dc-cal" id="qd-cal" role="dialog" aria-label="选择查询日期"><div class="dc-cal-head"><button class="dc-cal-nav" type="button" aria-label="上个月"><svg class="dc-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button><h3 class="dc-cal-title" aria-live="polite">2026年10月</h3><button class="dc-cal-nav" type="button" aria-label="下个月" disabled><svg class="dc-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button></div><div class="dc-cal-grid"><span class="dc-cal-week" aria-hidden="true">一</span><span class="dc-cal-week" aria-hidden="true">二</span><span class="dc-cal-week" aria-hidden="true">三</span><span class="dc-cal-week" aria-hidden="true">四</span><span class="dc-cal-week" aria-hidden="true">五</span><span class="dc-cal-week" aria-hidden="true">六</span><span class="dc-cal-week" aria-hidden="true">日</span></div><div class="dc-cal-grid dc-cal-days"><span></span><span></span><span></span><button class="dc-cal-day" type="button" aria-label="10月1日 星期四" aria-pressed="false">1</button><button class="dc-cal-day" type="button" aria-label="10月2日 星期五" aria-pressed="false">2</button><button class="dc-cal-day" type="button" aria-label="10月3日 星期六" aria-pressed="false">3</button><button class="dc-cal-day" type="button" aria-label="10月4日 星期日" aria-pressed="false">4</button><button class="dc-cal-day" type="button" aria-label="10月5日 星期一" aria-pressed="false">5</button><button class="dc-cal-day" type="button" aria-label="10月6日 星期二" aria-pressed="false">6</button><button class="dc-cal-day" type="button" aria-label="10月7日 星期三" aria-pressed="false">7</button><button class="dc-cal-day" type="button" aria-label="10月8日 星期四" aria-pressed="false">8</button><button class="dc-cal-day" type="button" aria-label="10月9日 星期五" aria-pressed="false">9</button><button class="dc-cal-day" type="button" aria-label="10月10日 星期六" aria-pressed="false">10</button><button class="dc-cal-day" type="button" aria-label="10月11日 星期日" aria-pressed="false">11</button><button class="dc-cal-day" type="button" aria-label="10月12日 星期一" aria-pressed="false">12</button><button class="dc-cal-day" type="button" aria-label="10月13日 星期二" aria-pressed="false">13</button><button class="dc-cal-day" type="button" aria-label="10月14日 星期三" aria-pressed="false">14</button><button class="dc-cal-day" type="button" aria-label="10月15日 星期四" aria-pressed="false">15</button><button class="dc-cal-day" type="button" aria-label="10月16日 星期五" aria-pressed="false">16</button><button class="dc-cal-day" type="button" aria-label="10月17日 星期六" aria-pressed="false">17</button><button class="dc-cal-day" type="button" aria-label="10月18日 星期日" aria-pressed="false">18</button><button class="dc-cal-day" type="button" aria-label="10月19日 星期一" aria-pressed="false">19</button><button class="dc-cal-day" type="button" aria-label="10月20日 星期二" aria-pressed="false">20</button><button class="dc-cal-day" type="button" aria-label="10月21日 星期三" aria-pressed="false">21</button><button class="dc-cal-day" type="button" aria-label="10月22日 星期四" aria-pressed="false">22</button><button class="dc-cal-day" type="button" aria-label="10月23日 星期五" aria-pressed="false">23</button><button class="dc-cal-day" type="button" aria-label="10月24日 星期六" aria-pressed="false">24</button><button class="dc-cal-day" type="button" aria-label="10月25日 星期日" aria-pressed="false">25</button><button class="dc-cal-day" type="button" aria-label="10月26日 星期一" aria-pressed="false">26</button><button class="dc-cal-day" type="button" aria-label="10月27日 星期二" aria-pressed="true">27</button><button class="dc-cal-day" type="button" aria-label="10月28日 星期三" aria-pressed="false">28</button><button class="dc-cal-day" type="button" aria-label="10月29日 星期四" aria-pressed="false">29</button><button class="dc-cal-day is-today" type="button" aria-label="10月30日 星期五" aria-pressed="false">30</button><button class="dc-cal-day" type="button" aria-label="10月31日 星期六" aria-pressed="false" disabled>31</button></div><div class="dc-cal-foot"><span>今天之后的日期不能选</span><button class="dc-btn dc-btn-secondary dc-btn-sm" type="button" data-today-btn>今天</button></div></div></div></div>
<script>const W='一二三四五六日';document.querySelectorAll('.dc-date').forEach(r=>{const t=r.querySelector('.dc-date-trigger'),c=r.querySelector('.dc-cal'),g=r.querySelector('.dc-cal-days'),h=r.querySelector('.dc-cal-title'),[pv,nx]=r.querySelectorAll('.dc-cal-nav');const [ty,tm,td]=r.dataset.today.split('-').map(Number),today=new Date(ty,tm-1,td);let sel=new Date(t.textContent.replace(/[年月]/g,'/').replace(/日.*/,'')),view=new Date(sel.getFullYear(),sel.getMonth(),1);const wk=d=>W[(d.getDay()+6)%7],same=(a,b)=>a.toDateString()==b.toDateString();const draw=()=>{const y=view.getFullYear(),m=view.getMonth(),n=new Date(y,m+1,0).getDate();h.textContent=y+'年'+(m+1)+'月';nx.disabled=y*12+m>=ty*12+tm-1;let s='<span></span>'.repeat((view.getDay()+6)%7);for(let d=1;d<=n;d++){const x=new Date(y,m,d);s+='<button class="dc-cal-day'+(same(x,today)?' is-today':'')+'" type="button" aria-label="'+(m+1)+'月'+d+'日 星期'+wk(x)+'" aria-pressed="'+same(x,sel)+'"'+(x>today?' disabled':'')+'>'+d+'</button>'}g.innerHTML=s};const pick=d=>{sel=d;t.firstElementChild.textContent=d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+wk(d);view=new Date(d.getFullYear(),d.getMonth(),1);draw();close()};const open=()=>{c.hidden=false;t.setAttribute('aria-expanded','true');draw();(g.querySelector('[aria-pressed=true]')||g.querySelector('.is-today')||g.querySelector('button:not(:disabled)'))?.focus()};const close=()=>{c.hidden=true;t.setAttribute('aria-expanded','false');t.focus()};t.onclick=()=>c.hidden?open():close();pv.onclick=()=>{view.setMonth(view.getMonth()-1);draw()};nx.onclick=()=>{view.setMonth(view.getMonth()+1);draw()};r.querySelector('[data-today-btn]').onclick=()=>pick(today);g.onclick=e=>{const b=e.target.closest('button');if(b&&!b.disabled)pick(new Date(view.getFullYear(),view.getMonth(),+b.textContent))};c.onkeydown=e=>{if(e.key=='Escape'){close();return}const k={ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7}[e.key];const b=e.target.closest('.dc-cal-day');if(!k||!b)return;e.preventDefault();const d=new Date(view.getFullYear(),view.getMonth(),+b.textContent+k);if(d>today)return;if(d.getMonth()!=view.getMonth()){view=new Date(d.getFullYear(),d.getMonth(),1);draw()}g.querySelectorAll('button')[d.getDate()-1].focus()};document.addEventListener('click',e=>{if(!c.hidden&&!r.contains(e.target))close()})})</script>
</body>
</html>
