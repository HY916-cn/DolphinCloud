<script>const W='一二三四五六日';document.querySelectorAll('.dc-date').forEach(r=>{const t=r.querySelector('.dc-date-trigger'),c=r.querySelector('.dc-cal'),g=r.querySelector('.dc-cal-days'),mg=r.querySelector('.dc-cal-months'),h=r.querySelector('.dc-cal-title'),[pv,nx]=r.querySelectorAll('.dc-cal-nav');const D=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)},today=D(r.dataset.today),ty=today.getFullYear(),tm=today.getMonth();let sel=D(r.dataset.value),view=new Date(sel.getFullYear(),sel.getMonth(),1),months=c.classList.contains('is-months'),back=view;const wk=d=>W[(d.getDay()+6)%7],same=(a,b)=>a.toDateString()==b.toDateString();const draw=()=>{const y=view.getFullYear(),m=view.getMonth();c.classList.toggle('is-months',months);h.setAttribute('aria-expanded',months);h.firstElementChild.textContent=y+'年'+(months?'':(m+1)+'月');pv.setAttribute('aria-label',months?'上一年':'上个月');nx.setAttribute('aria-label',months?'下一年':'下个月');nx.disabled=months?y>=ty:y*12+m>=ty*12+tm;let s='';for(let i=0;i<12;i++)s+='<button class="dc-cal-month'+(y==ty&&i==tm?' is-today':'')+'" type="button" aria-label="'+y+'年'+(i+1)+'月" aria-pressed="'+(y==sel.getFullYear()&&i==sel.getMonth())+'"'+(y*12+i>ty*12+tm?' disabled':'')+'>'+(i+1)+'月</button>';mg.innerHTML=s;s='<span></span>'.repeat((view.getDay()+6)%7);const n=new Date(y,m+1,0).getDate();for(let d=1;d<=n;d++){const x=new Date(y,m,d);s+='<button class="dc-cal-day'+(same(x,today)?' is-today':'')+'" type="button" aria-label="'+(m+1)+'月'+d+'日 星期'+wk(x)+'" aria-pressed="'+same(x,sel)+'"'+(x>today?' disabled':'')+'>'+d+'</button>'}g.innerHTML=s};const focusIn=box=>(box.querySelector('[aria-pressed=true]')||box.querySelector('.is-today')||box.querySelector('button:not(:disabled)'))?.focus();const pick=d=>{sel=d;r.dataset.value=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();t.firstElementChild.textContent=d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+wk(d);close()};const open=()=>{c.hidden=false;t.setAttribute('aria-expanded','true');months=false;view=new Date(sel.getFullYear(),sel.getMonth(),1);draw();focusIn(g)};const close=(f=true)=>{c.hidden=true;t.setAttribute('aria-expanded','false');if(f)t.focus()};t.onclick=()=>c.hidden?open():close();h.onclick=()=>{months=!months;if(months)back=new Date(view);draw();focusIn(months?mg:g)};pv.onclick=()=>{months?view.setFullYear(view.getFullYear()-1):view.setMonth(view.getMonth()-1);draw()};nx.onclick=()=>{months?view.setFullYear(view.getFullYear()+1):view.setMonth(view.getMonth()+1);if(view>today)view=new Date(ty,tm,1);draw()};r.querySelector('[data-today-btn]').onclick=()=>pick(today);g.onclick=e=>{const b=e.target.closest('button');if(b&&!b.disabled)pick(new Date(view.getFullYear(),view.getMonth(),+b.textContent))};mg.onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;view=new Date(view.getFullYear(),parseInt(b.textContent)-1,1);months=false;draw();focusIn(g)};c.onkeydown=e=>{if(e.key=='Escape'){if(months){months=false;view=back;draw();focusIn(g)}else close();return}const b=e.target.closest('.dc-cal-day,.dc-cal-month');if(!b)return;const isM=b.classList.contains('dc-cal-month');const k={ArrowLeft:-1,ArrowRight:1,ArrowUp:isM?-3:-7,ArrowDown:isM?3:7}[e.key];if(!k)return;e.preventDefault();if(isM){const i=parseInt(b.textContent)-1+k,y=view.getFullYear()+Math.floor(i/12),mi=(i%12+12)%12;if(y*12+mi>ty*12+tm)return;if(y!=view.getFullYear()){view=new Date(y,view.getMonth(),1);draw()}mg.children[mi].focus();return}const d=new Date(view.getFullYear(),view.getMonth(),+b.textContent+k);if(d>today)return;if(d.getMonth()!=view.getMonth()){view=new Date(d.getFullYear(),d.getMonth(),1);draw()}g.querySelectorAll('button')[d.getDate()-1].focus()};document.addEventListener('click',e=>{if(!c.hidden&&!e.composedPath().includes(r))close(false)})})</script>
