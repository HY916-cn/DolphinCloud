<!-- @dsCard group="表单" height=330 -->
<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Field</title><style>body{padding:24px}.demo{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-bottom:16px}.stack{display:flex;flex-direction:column;gap:12px;max-width:480px}.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}</style></head>
<body>
<div class="cols">
  <label class="dc-field">
    <span class="dc-field-label"><svg class="dc-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.744 17.736a6 6 0 1 1-7.48-7.48"/><path d="M15 6h1v4"/><path d="m6.134 14.768.866-.5 2 3.464"/><circle cx="16" cy="8" r="6"/></svg>存款金额</span>
    <span class="dc-input-wrap"><input class="dc-input" inputmode="numeric" placeholder="请输入金额" value="50"><span class="dc-input-unit">HTB</span></span>
    <span class="dc-field-hint">单笔最多存入 500 HTB</span>
  </label>
  <label class="dc-field is-error">
    <span class="dc-field-label"><svg class="dc-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 18H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5"/><path d="M18 12h.01"/><path d="M19 22v-6"/><path d="m22 19-3-3-3 3"/><path d="M6 12h.01"/><circle cx="12" cy="12" r="2"/></svg>取款金额</span>
    <span class="dc-input-wrap"><input class="dc-input" inputmode="numeric" value="2000"><span class="dc-input-unit">HTB</span></span>
    <span class="dc-field-hint"><svg class="dc-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>超出可用余额 1,280 HTB，请重新输入</span>
  </label>
</div>
</body>
</html>
