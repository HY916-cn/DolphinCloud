<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>登录</title><style>body{padding:20px}.devices{display:flex;gap:20px;align-items:flex-start}.dev{margin:0;flex:none}.dev-box{width:calc(var(--w)*var(--s)*1px);height:calc(var(--h)*var(--s)*1px);overflow:hidden;border-radius:16px;background:var(--surface);box-shadow:0 0 0 2px var(--line),var(--shadow-float)}.screen{width:calc(var(--w)*1px);height:calc(var(--h)*1px);transform:scale(var(--s));transform-origin:0 0;overflow:auto;scrollbar-width:none}.screen>.dc-app{min-height:100%}.dev figcaption{margin-top:8px;font:600 14px/20px var(--font-sans);color:var(--ink-muted)}</style></head>
<body>
<template id="page"><div class="dc-app"><div class="dc-login"><section class="dc-login-hero"><img class="dc-enter" src="/_blob/3db5cb4e2901c4767590e8c2cffe7d7e" alt="海豚云标志"><h1 class="display dc-enter" style="--i:1">海豚云</h1><p class="body-lg dc-enter" style="--i:2">明德实验学校海豚银行 · 线上服务平台</p><ul class="dc-login-points"><li class="dc-enter" style="--i:3"><span><svg class="dc-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.744 17.736a6 6 0 1 1-7.48-7.48"/><path d="M15 6h1v4"/><path d="m6.134 14.768.866-.5 2 3.464"/><circle cx="16" cy="8" r="6"/></svg></span>随时查询余额与交易明细</li><li class="dc-enter" style="--i:4"><span><svg class="dc-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 18H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5"/><path d="m16 19 3 3 3-3"/><path d="M18 12h.01"/><path d="M19 16v6"/><path d="M6 12h.01"/><circle cx="12" cy="12" r="2"/></svg></span>存款、取款、兑换在柜台一站办理</li><li class="dc-enter" style="--i:5"><span><svg class="dc-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v16"/><path d="M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z"/></svg></span>每一笔账目都有记录，可随时核对</li></ul><div class="dc-waves is-drifting" aria-hidden="true"><i></i><i></i><i></i></div></section><form class="dc-login-panel dc-enter" style="--i:2" onsubmit="return false"><div><h2 class="heading">登录</h2><p class="caption" style="margin:4px 0 0;color:var(--ink-muted)">请选择身份，输入账号和密码。</p></div><div class="dc-choices" role="radiogroup" aria-label="身份"><label class="dc-choice"><input type="radio" name="role" checked><span class="dc-choice-icon"><svg class="dc-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span><span><b>学生</b><small>学号登录</small></span></label><label class="dc-choice"><input type="radio" name="role"><span class="dc-choice-icon"><svg class="dc-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/></svg></span><span><b>工作人员</b><small>账号登录</small></span></label></div><label class="dc-field"><span class="dc-field-label"><svg class="dc-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>学号</span><span class="dc-input-wrap"><input class="dc-input" inputmode="numeric" autocomplete="username" placeholder="请输入学号" value="20230415"></span></label><label class="dc-field"><span class="dc-field-label"><svg class="dc-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>密码</span><span class="dc-input-wrap"><input class="dc-input" type="password" autocomplete="current-password" placeholder="请输入密码" value="dolphin"></span><span class="dc-field-hint">首次登录使用初始密码，登录后需设置新密码</span></label><button class="dc-btn dc-btn-primary dc-btn-block" type="submit">登录</button><p class="dc-login-help">忘记密码请联系指导老师重置</p></form></div></div></template>
<div class="devices"><figure class="dev" style="--w:390;--h:844;--s:0.66"><div class="dev-box"><div class="screen"></div></div><figcaption>手机 390</figcaption></figure><figure class="dev" style="--w:820;--h:1180;--s:0.47"><div class="dev-box"><div class="screen"></div></div><figcaption>平板 820</figcaption></figure><figure class="dev" style="--w:1280;--h:800;--s:0.56"><div class="dev-box"><div class="screen"></div></div><figcaption>电脑 1280</figcaption></figure></div>
<script>const t=document.getElementById('page');document.querySelectorAll('.screen').forEach((s,i)=>{s.append(t.content.cloneNode(true));s.querySelectorAll('[name]').forEach(e=>e.name+=i)});</script>
</body>
</html>
