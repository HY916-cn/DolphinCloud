<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Button</title><style>body{padding:24px}.demo{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-bottom:16px}.stack{display:flex;flex-direction:column;gap:12px;max-width:480px}.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}</style></head>
<body>
<div class="demo">
  <button class="dc-btn dc-btn-primary"><svg class="dc-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 18H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5"/><path d="m16 19 3 3 3-3"/><path d="M18 12h.01"/><path d="M19 16v6"/><path d="M6 12h.01"/><circle cx="12" cy="12" r="2"/></svg>存款</button>
  <button class="dc-btn dc-btn-primary">确认存款</button>
  <button class="dc-btn dc-btn-secondary"><svg class="dc-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>查询余额</button>
  <button class="dc-btn dc-btn-ghost">返回</button>
</div>
<div class="demo">
  <button class="dc-btn dc-btn-primary dc-btn-sm">知道了</button>
  <button class="dc-btn dc-btn-secondary dc-btn-sm"><svg class="dc-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>帮助</button>
  <button class="dc-btn dc-btn-primary" disabled>余额不足</button>
</div>
</body>
</html>
