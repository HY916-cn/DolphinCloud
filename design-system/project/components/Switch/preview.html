<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Switch</title><style>body{padding:24px}.dc-toast,.dc-sheet,.dc-scrim,.dc-progress-fill{animation:none}</style></head>
<body>
<div class="dc-card" style="max-width:480px;display:flex;flex-direction:column;gap:12px"><label class="dc-switch"><span class="dc-switch-text"><b>到账通知</b><small>存款、取款、奖励到账时提醒我</small></span><input type="checkbox" role="switch" checked><span class="dc-switch-track"></span></label><label class="dc-switch"><span class="dc-switch-text"><b>排名中匿名显示</b><small>其他同学只能看到“匿名同学”</small></span><input type="checkbox" role="switch"><span class="dc-switch-track"></span></label><label class="dc-switch"><span class="dc-switch-text"><b>柜台办理提醒</b><small>由指导老师统一设置</small></span><input type="checkbox" role="switch" checked disabled><span class="dc-switch-track"></span></label></div>
</body>
</html>
