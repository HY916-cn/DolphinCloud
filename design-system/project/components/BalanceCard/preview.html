<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>BalanceCard</title><style>body{padding:24px}.demo{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-bottom:16px}.stack{display:flex;flex-direction:column;gap:12px;max-width:480px}.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}</style></head>

  <div class="dc-waves" aria-hidden="true"><i></i><i></i><i></i></div>
</div>

</html>
