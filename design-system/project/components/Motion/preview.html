<!-- @dsCard group="动效" height=520 -->
<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Motion</title><style>body{padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}.cell{display:flex;flex-direction:column;gap:12px;padding:16px;background:var(--surface-raised);border:2px solid var(--line);border-radius:var(--radius-lg)}.cell h3{margin:0;font:700 16px/26px var(--font-sans)}.cell p{margin:0;font:500 14px/20px var(--font-sans);color:var(--ink-muted)}.stage{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:8px;min-height:132px;padding:12px;background:var(--surface);border-radius:var(--radius-md)}.bar{height:24px;border-radius:var(--radius-sm);background:var(--cloud-200)}.bar:nth-child(2){width:80%}.bar:nth-child(3){width:60%}.num{font:800 40px/48px var(--font-sans);font-variant-numeric:tabular-nums;text-align:center}.panel{padding:12px;background:var(--surface-raised);border-radius:var(--radius-md);font:600 16px/26px var(--font-sans)}.stage .dc-waves{position:absolute;left:0;right:0;bottom:0}.stage .dc-result-badge .dc-icon{width:36px;height:36px}</style></head>
<body>
<div class="grid"><div class="cell"><h3>内容进入</h3><p>上移 12px + 淡入，240ms，ease-out；每块延后 40ms，最多 6 块</p><div class="stage"><div class="bar dc-enter" data-anim="dc-enter" style="--i:0"></div><div class="bar dc-enter" data-anim="dc-enter" style="--i:1"></div><div class="bar dc-enter" data-anim="dc-enter" style="--i:2"></div></div><button class="dc-btn dc-btn-secondary dc-btn-sm" type="button" data-replay>重播</button></div><div class="cell"><h3>办理成功</h3><p>对勾弹出 320ms（轻微回弹），余额数字滚动 600ms</p><div class="stage"><span class="dc-result-badge dc-pop" data-anim="dc-pop" style="margin:0 auto;width:64px;height:64px"><svg class="dc-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m16 9-5.5 5.5L8 12"/></svg></span><div class="num" data-count="1280">1,280</div></div><button class="dc-btn dc-btn-secondary dc-btn-sm" type="button" data-replay>重播</button></div><div class="cell"><h3>页面前进 / 返回</h3><p>新页面从右侧 24px 滑入并淡入，320ms；返回方向相反</p><div class="stage"><div class="panel dc-page-forward" data-anim="dc-page-forward">存款 · 录入面额</div></div><button class="dc-btn dc-btn-secondary dc-btn-sm" type="button" data-replay>重播</button></div><div class="cell"><h3>输入有误</h3><p>输入框左右轻摆两次，240ms，同时出现提示文字</p><div class="stage"><div class="dc-input-wrap dc-nudge" data-anim="dc-nudge" style="border-color:var(--danger)"><input class="dc-input" value="2000" aria-label="取款金额"></div><span class="dc-field-hint" style="color:var(--danger)"><svg class="dc-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>超出可用余额，请重新输入</span></div><button class="dc-btn dc-btn-secondary dc-btn-sm" type="button" data-replay>重播</button></div><div class="cell"><h3>按下反馈</h3><p>下沉 3～4px、厚底变薄，100ms；松开即回弹</p><div class="stage"><button class="dc-btn dc-btn-primary" type="button" style="align-self:center">请按一下</button></div></div><div class="cell"><h3>海浪</h3><p>只在登录页缓慢平移，周期 9～24 秒；开启“减少动态效果”时静止</p><div class="stage"><div class="dc-waves is-drifting" aria-hidden="true"><i></i><i></i><i></i></div></div></div></div>
<script>function dcCount(el){const to=+el.dataset.count;if(matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=to.toLocaleString('en-US');return}const from=+(el.dataset.from||0),t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/600),e=1-Math.pow(1-p,3);el.textContent=Math.round(from+(to-from)*e).toLocaleString('en-US');if(p<1)requestAnimationFrame(f)})(t0)}document.querySelectorAll('[data-replay]').forEach(b=>b.onclick=()=>{const c=b.closest('.cell');c.querySelectorAll('[data-anim]').forEach(e=>{e.classList.remove(e.dataset.anim);void e.offsetWidth;e.classList.add(e.dataset.anim)});c.querySelectorAll('[data-count]').forEach(dcCount)});</script>
</body>
</html>
