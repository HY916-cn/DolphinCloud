<!-- @dsCard group="表单" height=300 -->
<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>QtyStepper</title><style>body{padding:24px}.dc-toast,.dc-sheet,.dc-scrim,.dc-progress-fill,.dc-notice,.dc-guide-bubble,.dc-field-hint{animation:none}</style></head>
<body>
<div style="max-width:440px"><div class="dc-denoms"><div class="dc-qty dc-hue-sea"><div class="dc-qty-head"><span class="dc-qty-face">1<small>元</small></span><span class="dc-qty-sum">小计<b>0</b></span></div><div class="dc-qty-ctrl"><button class="dc-qty-btn" type="button" aria-label="减少一张 1 元" disabled><svg class="dc-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg></button><input class="dc-qty-input" inputmode="numeric" aria-label="1 元张数" value="0" data-face="1"><button class="dc-qty-btn" type="button" aria-label="增加一张 1 元"><svg class="dc-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button></div></div><div class="dc-qty dc-hue-grape"><div class="dc-qty-head"><span class="dc-qty-face">2<small>元</small></span><span class="dc-qty-sum">小计<b>0</b></span></div><div class="dc-qty-ctrl"><button class="dc-qty-btn" type="button" aria-label="减少一张 2 元" disabled><svg class="dc-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg></button><input class="dc-qty-input" inputmode="numeric" aria-label="2 元张数" value="0" data-face="2"><button class="dc-qty-btn" type="button" aria-label="增加一张 2 元"><svg class="dc-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button></div></div><div class="dc-qty dc-hue-rose is-filled"><div class="dc-qty-head"><span class="dc-qty-face">5<small>元</small></span><span class="dc-qty-sum">小计<b>5</b></span></div><div class="dc-qty-ctrl"><button class="dc-qty-btn" type="button" aria-label="减少一张 5 元"><svg class="dc-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg></button><input class="dc-qty-input" inputmode="numeric" aria-label="5 元张数" value="1" data-face="5"><button class="dc-qty-btn" type="button" aria-label="增加一张 5 元"><svg class="dc-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button></div></div><div class="dc-qty dc-hue-sun is-filled"><div class="dc-qty-head"><span class="dc-qty-face">10<small>元</small></span><span class="dc-qty-sum">小计<b>10</b></span></div><div class="dc-qty-ctrl"><button class="dc-qty-btn" type="button" aria-label="减少一张 10 元"><svg class="dc-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg></button><input class="dc-qty-input" inputmode="numeric" aria-label="10 元张数" value="1" data-face="10"><button class="dc-qty-btn" type="button" aria-label="增加一张 10 元"><svg class="dc-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button></div></div></div></div>
<script>document.querySelectorAll('.dc-qty').forEach(r=>{const i=r.querySelector('input'),[m,p]=r.querySelectorAll('button'),b=r.querySelector('.dc-qty-sum b');const set=n=>{n=Math.max(0,Math.min(99,n|0));i.value=n;m.disabled=n===0;b.textContent=n*i.dataset.face;r.classList.toggle('is-filled',n>0)};m.onclick=()=>set(+i.value-1);p.onclick=()=>set(+i.value+1);i.oninput=()=>set(+i.value)})</script>
</body>
</html>
