<html lang="zh-CN">
<head><meta charset="utf-8"><title>ActionBar</title><style>body{padding:20px}.devices{display:flex;gap:20px;align-items:flex-start}.dev{margin:0;flex:none}.dev-box{width:calc(var(--w)*var(--s)*1px);height:calc(var(--h)*var(--s)*1px);overflow:hidden;border-radius:16px;background:var(--surface);box-shadow:0 0 0 2px var(--line),var(--shadow-float)}.screen{width:calc(var(--w)*1px);height:calc(var(--h)*1px);transform:scale(var(--s));transform-origin:0 0;overflow:auto;scrollbar-width:none}.screen>.dc-app{min-height:100%}.dev figcaption{margin-top:8px;font:600 14px/20px var(--font-sans);color:var(--ink-muted)}</style></head>
