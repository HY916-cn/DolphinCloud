me-opt" type="button" aria-label="35分" aria-pressed="false">35</button><button class="dc-time-opt" type="button" aria-label="40分" aria-pressed="false">40</button><button class="dc-time-opt" type="button" aria-label="45分" aria-pressed="false">45</button><button class="dc-time-opt" type="button" aria-label="50分" aria-pressed="false">50</button><button class="dc-time-opt" type="button" aria-label="55分" aria-pressed="false">55</button></div><div class="dc-cal-foot"><span>柜台营业 07:00–17:59</span></div></div></div></div><div style="flex:1 1 300px;max-width:380px"><div class="dc-field dc-time" data-value="21:00"><label class="dc-field-label" for="rm"><svg class="dc-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>提醒时间</label><button class="dc-date-trigger" id="rm" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="rm-pop"><span>21:00</span><svg class="dc-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></button><div class="dc-cal" id="rm-pop" role="dialog" aria-label="选择提醒时间" hidden><p class="dc-time-label" id="rm-h">时</p><div class="dc-time-grid" role="group" aria-labelledby="rm-h"><button class="dc-time-opt" type="button" aria-label="0时" aria-pressed="false">00</button><button class="dc-time-opt" type="button" aria-label="1时" aria-pressed="false">01</button><button class="dc-time-opt" type="button" aria-label="2时" aria-pressed="false">02</button><button class="dc-time-opt" type="button" aria-label="3时" aria-pressed="false">03</button><button class="dc-time-opt" type="button" aria-label="4时" aria-pressed="false">04</button><button class="dc-time-opt" type="button" aria-label="5时" aria-pressed="false">05</button><button class="dc-time-opt" type="button" aria-label="6时" aria-pressed="false">06</button><button class="dc-time-opt" type="button" aria-label="7时" aria-pressed="false">07</button><button class="dc-time-opt" type="button" aria-label="8时" aria-pressed="false">08</button><button class="dc-time-opt" type="button" aria-label="9时" aria-pressed="false">09</button><button class="dc-time-opt" type="button" aria-label="10时" aria-pressed="false">10</button><button class="dc-time-opt" type="button" aria-label="11时" aria-pressed="false">11</button><button class="dc-time-opt" type="button" aria-label="12时" aria-pressed="false">12</button><button class="dc-time-opt" type="button" aria-label="13时" aria-pressed="false">13</button><button class="dc-time-opt" type="button" aria-label="14时" aria-pressed="false">14</button><button class="dc-time-opt" type="button" aria-label="15时" aria-pressed="false">15</button><button class="dc-time-opt" type="button" aria-label="16时" aria-pressed="false">16</button><button class="dc-time-opt" type="button" aria-label="17时" aria-pressed="false">17</button><button class="dc-time-opt" type="button" aria-label="18时" aria-pressed="false">18</button><button class="dc-time-opt" type="button" aria-label="19时" aria-pressed="false">19</button><button class="dc-time-opt" type="button" aria-label="20时" aria-pressed="false">20</button><button class="dc-time-opt" type="button" aria-label="21时" aria-pressed="true">21</button><button class="dc-time-opt" type="button" aria-label="22时" aria-pressed="false">22</button><button class="dc-time-opt" type="button" aria-label="23时" aria-pressed="false">23</button></div><p class="dc-time-label" id="rm-m">分</p><div class="dc-time-grid" role="group" aria-labelledby="rm-m"><button class="dc-time-opt" type="button" aria-label="0分" aria-pressed="true">00</button><button class="dc-time-opt" type="button" aria-label="5分" aria-pressed="false">05</button><button class="dc-time-opt" type="button" aria-label="10分" aria-pressed="false">10</button><button class="dc-time-o <script>document.querySelectorAll('.dc-time').forEach(r=>{const t=r.querySelector('.dc-date-trigger'),c=r.querySelector('.dc-cal'),[hg,mg]=r.querySelectorAll('.dc-time-grid');let [h,m]=r.dataset.value.split(':');const draw=()=>{for(const b of hg.children)b.setAttribute('aria-pressed',b.textContent==h);for(const b of mg.children)b.setAttribute('aria-pressed',b.textContent==m);r.dataset.value=t.firstElementChild.textContent=h+':'+m};const focusIn=g=>(g.querySelector('[aria-pressed=true]')||g.querySelector('button:not(:disabled)')).focus();const close=(f=true)=>{c.hidden=true;t.setAttribute('aria-expanded','false');if(f)t.focus()};t.onclick=()=>{if(!c.hidden)return close();c.hidden=false;t.setAttribute('aria-expanded','true');focusIn(hg)};hg.onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;h=b.textContent;draw();focusIn(mg)};mg.onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;m=b.textContent;draw();close()};c.onkeydown=e=>{if(e.key=='Escape')return close();const b=e.target.closest('.dc-time-opt'),k={ArrowLeft:-1,ArrowRight:1,ArrowUp:-6,ArrowDown:6}[e.key];if(!b||!k)return;e.preventDefault();const n=b.parentElement.children[[...b.parentElement.children].indexOf(b)+k];if(n&&!n.disabled)n.focus()};document.addEventListener('click',e=>{if(!c.hidden&&!e.composedPath().includes(r))close(false)})})</script>
