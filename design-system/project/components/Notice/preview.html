<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Notice</title><style>body{padding:24px}.demo{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-bottom:16px}.stack{display:flex;flex-direction:column;gap:12px;max-width:480px}.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}</style></head>
<body>
<div class="stack">
  <div class="dc-notice dc-notice-success" role="status"><svg class="dc-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m16 9-5.5 5.5L8 12"/></svg><div><p class="dc-notice-title">存款成功</p><p class="dc-notice-text">50 HTB 已存入你的活期账户。</p></div></div>

  <div class="dc-notice dc-notice-coin"><svg class="dc-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg><div><p class="dc-notice-title">获得老师奖励</p><p class="dc-notice-text">值日之星奖励 10 HTB 已到账，继续加油！</p></div></div>
  <div class="dc-notice dc-notice-danger" role="alert"><svg class="dc-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg><div><p class="dc-notice-title">定时任务没有完成</p><p class="dc-notice-text">每天的任务已处理到 11月9日，11月10日 没有完成：<code>division by zero</code>。在服务器上运行 <code>dolphin jobs</code> 查看，用 <code>dolphin jobs run</code> 重试。</p></div></div><div class="dc-notice dc-notice-danger" role="alert"><svg class="dc-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg><div class="dc-notice-body"><p class="dc-notice-title">离线存款未能入账：张小明 20 HTB</p><p class="dc-notice-text">账户已冻结。10 元 × 2，11月26日 09:05 登记，请交银行管理员核对纸质凭条。</p><div class="dc-notice-actions"><button class="dc-btn dc-btn-secondary dc-btn-sm" type="button">重试</button><button class="dc-btn dc-btn-ghost dc-btn-sm" type="button">已核对，移除</button></div></div></div>
</div>
</body>
</html>
